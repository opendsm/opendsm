name: Test

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    # run monthly to monitor dependency updates
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        # nlopt publishes wheels only for linux-x86_64, macOS-arm64, and
        # win-amd64; one runner per OS covers exactly those architectures.
        # ARM-Linux and Intel-Mac are omitted because it ships no wheels
        # there (a source build would just reproduce #578). Snapshot
        # tolerances absorb cross-platform BLAS/FMA drift, so floating -latest
        # images are fine and no second macOS-version runner is needed.
        os: [ubuntu-latest, windows-latest, macos-latest]
        pandas: [latest]
        resolution: [highest]
        include:
          # pandas 2 remains a supported major (pandas<4); one extra job pins it
          # so that coverage does not depend on which Python still resolves it.
          # The differing `pandas` value makes this a new combination rather
          # than an addition to the existing 3.12 / ubuntu job. The same holds
          # for the minimum job below: its differing `resolution` value makes it
          # a new 3.11 / ubuntu combination, so it is covered by `build (all)`.
          - python: "3.12"
            os: ubuntu-latest
            pandas: "2"
            toxenv: 3.12-pandas2
          # every direct dependency at its declared floor
          - python: "3.11"
            os: ubuntu-latest
            pandas: latest
            resolution: lowest
            toxenv: minimum
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python }} on ${{ matrix.os }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox tox-uv
      - name: Check uv.lock is current
        if: matrix.resolution == 'lowest'
        # before tox: its uv plugin leaves a `.venv` pointer file in the checkout that uv
        # refuses as a project environment; uv is on PATH because tox-uv depends on it
        run: uv lock --check
      - name: Run tox
        run: tox -e ${{ matrix.toxenv || matrix.python }}

  # The publish workflow never runs on pull requests, so build the distribution
  # here to catch packaging breakage before release day
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

  # Fan-in over the build matrix so branch protection can require a single
  # context instead of every (python, os) combination. needs.build.result is
  # 'success' only if every matrix combination passed.
  build-all:
    name: build (all)
    if: always()
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs and the package build passed
        if: needs.build.result != 'success' || needs.package.result != 'success'
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          echo "package result: ${{ needs.package.result }}"
          exit 1

name: Test

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    # run monthly to monitor dependency updates
    - cron: "0 0 1 * *"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # nlopt publishes wheels only for linux-x86_64, macOS-arm64, and
        # win-amd64; one runner per OS covers exactly those architectures.
        # ARM-Linux and Intel-Mac are omitted because it ships no wheels
        # there (a source build would just reproduce #578). Snapshot
        # tolerances absorb cross-platform BLAS/FMA drift, so floating -latest
        # images are fine and no second macOS-version runner is needed.
        os: [ubuntu-latest, windows-latest, macos-latest]
        pandas: [latest]
        include:
          # pandas 2 remains a supported major (pandas<4); one extra job pins it
          # so that coverage does not depend on which Python still resolves it.
          # The differing `pandas` value makes this a new combination rather
          # than an addition to the existing 3.12 / ubuntu job.
          - python: "3.12"
            os: ubuntu-latest
            pandas: "2"
            toxenv: 3.12-pandas2
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Run tox
        run: tox -e ${{ matrix.toxenv || matrix.python }}

  # Fan-in over the build matrix so branch protection can require a single
  # context instead of every (python, os) combination. needs.build.result is
  # 'success' only if every matrix combination passed.
  build-all:
    name: build (all)
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        if: needs.build.result != 'success'
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          exit 1
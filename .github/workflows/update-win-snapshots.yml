name: Update Windows snapshots

# Regenerates and commits the Windows-specific regression snapshots (the
# `[regression_win]` files pinned by the daily-model-derived tests, where
# DailyModel's nlopt SBPLX optimizer lands at a different local minimum on
# win32). Run on demand after intentionally changing daily-model behavior —
# never per-PR, so the committed snapshots stay a stable baseline the
# Windows matrix tests against rather than auto-blessing whatever Windows
# produces.
#
# The Windows job runs `pytest -m regression --snapshot-update` and uploads
# the regenerated snapshots; a follow-up Linux job copies them into the
# tests/ tree and commits the diff back to the dispatched branch.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: windows-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package + test deps (mirrors tox.ini)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tutorial]"
          pip install pytest pytest-cov pytest-xdist "syrupy>=5,<7"
      - name: Regenerate snapshots
        # --snapshot-update returns non-zero when snapshots change; we
        # want the resulting files regardless. Serial (-n 0) because syrupy
        # warns on --snapshot-update across xdist workers without its file
        # lock, and the suite turns warnings into errors.
        continue-on-error: true
        run: pytest tests/ -m regression --snapshot-update -n 0
      - name: Upload Windows snapshot artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-regression-snapshots
          path: |
            tests/eemeter/daily_model/__snapshots__/**/*_win*.json
            tests/eemeter/hourly_caltrack/__snapshots__/test_derivatives/**/*_win*.json
          if-no-files-found: warn

  commit:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Windows snapshot artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-regression-snapshots
          path: artifact-staging
        continue-on-error: true
      - name: Move _win snapshots into the tests tree
        run: |
          set -e
          if [ ! -d artifact-staging ]; then
            echo "No artifact directory; nothing to commit."
            exit 0
          fi
          # The artifact roots its paths at the uploaded paths' common
          # ancestor, tests/eemeter, and syrupy names each file
          # `<test>[regression_win].json`. Copy each back to its place.
          find artifact-staging -name "*_win*.json" -print | while read -r src; do
            rel="${src#artifact-staging/}"
            mkdir -p "tests/eemeter/$(dirname "$rel")"
            cp "$src" "tests/eemeter/$rel"
          done
          rm -rf artifact-staging
      - name: Commit and push _win changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the _win.json files. Anything else is incidental.
          git add 'tests/**/*_win*.json' || true
          if git diff --cached --quiet; then
            echo "No _win snapshot changes to commit."
            exit 0
          fi
          git commit -s -m "ci: update Windows regression snapshots"
          git push

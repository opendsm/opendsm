[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opendsm"
version = "2.0.0"
description = "Standard methods for predicting building energy usage"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "opendsm", email = "opendsm@lists.lfenergy.org" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "matplotlib",  # imported at module scope by the plotting and diagnostics modules
  "nlopt>=2.10",  # first release with cp313 / cp314 wheels
  "numba",
  "numpy>=1.24.4",
  "pandas>=1.1.0,<4.0.0",
  "platformdirs",
  "pyarrow>=15.0.0",
  "pydantic>=2.0",
  "pywavelets",
  "requests",
  "qpsolvers[highs]",
  "scikit-learn>=1.5.0",  # first release with the covariance_eigh PCA solver
  "scipy>=1.10.1",
  "statsmodels",
  "threadpoolctl>=3.2.0",
]

[project.optional-dependencies]
ann = [
  "hnswlib>=0.7.0",
]
dev = [
  "black",
  "coverage",
  "pytest",
  "pytest-cov>=7.0.0",
  "pytest-profiling",
  "pytest-xdist",
  "syrupy>=5,<6",
  "tox",
  "twine",
]

[tool.hatch.build.targets.wheel]
# non-src layout: the importable package directory is opendsm/opendsm
packages = ["opendsm"]

[tool.hatch.build.targets.sdist]
# tutorial/test datasets are downloaded on demand (load_test_data), not shipped
exclude = ["/data"]

[project.urls]
Homepage = "https://lfenergy.org/projects/opendsm"
Documentation = "https://opendsm.energy"
Repository = "https://github.com/opendsm/opendsm"
Issues = "https://github.com/opendsm/opendsm/issues"

[tool.pytest.ini_options]
# --cov / --cov-report are off by default to keep normal runs fast. The
# sys.monitoring coverage backend (see [tool.coverage.run] core) keeps
# breakpoints/pdb working under --cov on Python 3.12+, so enabling these no
# longer blocks local debugging there. Run a debug+coverage session serially
# (-n0); the debugger can't attach to xdist workers.
addopts = [
  "-n", "auto",            # parallel run (pytest-xdist)
  "-vv",                   # verbose
  # The regression snapshots are split by platform (`SNAP_SUFFIX`), so the
  # variants for the other platform are always unused and syrupy would
  # otherwise fail the run. Deleting them is not an option: each set is the
  # one in use on its own platform. Mismatches remain fatal.
  "--snapshot-warn-unused",
  # "--cov=./",
  # "--cov-report", "term-missing",
]
markers = [
  "slow: tests that take >1s on a typical workstation; skip in dev loops with `pytest -m \"not slow\"`",
  "regression: snapshot regression tests pinning full prediction arrays",
  "hourly_model: tests that fit HourlyModel (spectral clustering + elasticnet — slowest path)",
]
# `error` turns warnings into failures; the entries below suppress known-benign
# native-extension warnings that would otherwise fail (or segfault) the run.
filterwarnings = [
  "error",
  "default:Level value of 5 is too high",
  "ignore:builtin type swigvarlink has no __module__ attribute",
  "ignore:builtin type SwigPyObject has no __module__ attribute",
  "default:`BaseEstimator._validate_data` is deprecated in 1.6",
  # coverage on Python <3.12 can't use the sysmon core and warns; harmless fallback
  "ignore:Can't use core=sysmon",
]

[tool.coverage.run]
# sys.monitoring backend (Python 3.12+) leaves sys.settrace free, so coverage
# and the debugger coexist; older versions warn and fall back to the C tracer.
core = "sysmon"
# Run coverage under NUMBA_DISABLE_JIT=1 (see `tox -e coverage`); JIT-compiled
# functions execute as native code the tracer cannot see, so they report as
# uncovered even when exercised.
omit = [
  ".tox/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "if TYPE_CHECKING:",
  "def _warmup_numba",
]
# Conservative floor for `tox -e coverage` (full suite, JIT off). Raise it as
# test coverage is added. The full suite measures 87.37% JIT-off.
fail_under = 87
